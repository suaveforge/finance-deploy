<script>
const SERVER = (localStorage.getItem('trade_server') || 'https://api-finance.suaveforge.com:18465/api').replace(/\/$/, '');
const DATA_SERVER = (localStorage.getItem('data_server') || 'https://finance.suaveforge.com/data').replace(/\/$/, '');
const API_DELAY_MS = 500;
const CHART_POINTS = 90;
const DAILY_THRESHOLD_FALLBACK_PCT = 2;
const DEFAULT_DAILY_RANGE_PERCENT = 80;
const SIGNAL_TARGETS_KEY = 'overview_signal_targets';
const MAX_SIGNAL_TARGETS = 2;

let symbols = [];
let autoTimer = null;
const DEFAULT_AUTO_REFRESH = false;

let autoOn = DEFAULT_AUTO_REFRESH;
let cardMode = 'summary';
let refreshSeq = 0;
let refreshing = false;
let investorCache = {};
let dailyChartCache = {};
let dailyThresholdCache = {};
let flowInputCache = {};
let hogaPressureState = {};
let priceHistoryCache = {};
let reversalDebugCache = {};
let signalDailyCounts = {};
let recoveryOrderEntries = {};
let recoveryOrderBusy = {};
let signalOrderOn = false;
let signalOrderAuto = false;
let signalOrderBusy = {};
let signalReversalActionLock = {};
let signalOrderStatus = {};
let signalTargetCodes = loadSignalTargets();
let dailyThresholdDateKey = todayKey();
let dailyThresholdTimer = null;

function fmt(v) {
    const n = parseInt(v, 10);
    if (isNaN(n)) return '-';
    return n.toLocaleString('ko-KR');
}

function fmtCompact(v) {
    const n = parseInt(v, 10);
    if (isNaN(n)) return '-';
    const abs = Math.abs(n);
    const sign = n > 0 ? '+' : n < 0 ? '-' : '';
    if (abs >= 100000000) return sign + Math.round(abs / 100000000).toLocaleString('ko-KR') + '억';
    if (abs >= 10000) return sign + Math.round(abs / 10000).toLocaleString('ko-KR') + '만';
    return sign + abs.toLocaleString('ko-KR');
}

function fmtMarketCap(v) {
    const n = parseNum(v);
    if (!n) return '-';
    if (n >= 1000000000000) {
        const jo = n / 1000000000000;
        return (jo >= 10 ? Math.round(jo) : Math.round(jo * 10) / 10).toLocaleString('ko-KR') + '조';
    }
    if (n >= 100000000) {
        return Math.round(n / 100000000).toLocaleString('ko-KR') + '억';
    }
    return n.toLocaleString('ko-KR');
}

function parseNum(v) {
    const n = parseInt(String(v || '0').replace(/,/g, ''), 10);
    return isNaN(n) ? 0 : n;
}

function setStatus(text, live) {
    document.getElementById('status-text').textContent = text;
    document.getElementById('live-dot').classList.toggle('on', !!live && autoOn);
}

function nowLabel() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' +
           d.getMinutes().toString().padStart(2, '0') + ':' +
           d.getSeconds().toString().padStart(2, '0');
}

async function loadSymbols() {
    const res = await fetch(`${DATA_SERVER}/ranking/symbols_marketcap.csv?t=${Date.now()}`);
    if (!res.ok) throw new Error('ranking not found');
    const text = await res.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];

    const headers = lines[0].split(',').map(h => h.trim());
    const rankingIdx = headers.indexOf('ranking');
    const symbolIdx = headers.indexOf('symbol');
    const nameIdx = headers.indexOf('kor_name');
    const capIdx = headers.indexOf('cap');
    const priceIdx = headers.indexOf('prpr');
    const limit = parseInt(document.getElementById('rank-limit').value, 10);

    return lines.slice(1, limit + 1).map((line, i) => {
        const c = line.split(',');
        return {
            rank: parseNum(c[rankingIdx]) || i + 1,
            code: (c[symbolIdx] || '').trim(),
            name: (c[nameIdx] || '').trim(),
            cap: (c[capIdx] || '').trim(),
            rankPrice: (c[priceIdx] || '').trim(),
        };
    }).filter(s => s.code);
}

function signalStrength(value, basis, kind) {
    const abs = Math.abs(value);
    if (abs <= 0) return 0;
    if (kind === 'hoga') {
        const ratio = abs / Math.max(1, basis);
        if (ratio >= 0.35) return 3;
        if (ratio >= 0.15) return 2;
        return 1;
    }
    if (abs >= 100000) return 3;
    if (abs >= 10000) return 2;
    return 1;
}

function signedStrength(value, basis, kind) {
    const strength = signalStrength(value, basis, kind);
    return value > 0 ? strength : value < 0 ? -strength : 0;
}

function pressureTimeLabel(seconds) {
    if (seconds >= 30) return '지속';
    if (seconds >= 15) return '유지';
    return seconds + 's';
}

function computeHogaPressure(code, ntby, totalAsk, totalBid) {
    const now = Date.now();
    const total = Math.max(1, totalAsk + totalBid);
    const net = ntby || (totalBid - totalAsk);
    const ratio = net / total;
    const direction = ratio > 0 ? 1 : ratio < 0 ? -1 : 0;
    const absRatio = Math.abs(ratio);
    const strength = absRatio >= 0.45 ? 3 : absRatio >= 0.25 ? 2 : absRatio >= 0.10 ? 1 : 0;
    let state = hogaPressureState[code];

    if (!direction || !strength) {
        state = { direction: 0, since: now, lastSeen: now };
    } else if (!state || state.direction !== direction) {
        state = { direction, since: now, lastSeen: now };
    } else {
        state.lastSeen = now;
    }
    hogaPressureState[code] = state;

    const seconds = direction && strength ? Math.floor((now - state.since) / 1000) : 0;
    const score = Math.round(ratio * 100);
    const component = score / 100 * 3;

    return {
        net,
        direction,
        strength,
        seconds,
        score,
        component,
        label: '압력 ' + (score > 0 ? '+' : '') + score + ' ' + pressureTimeLabel(seconds),
    };
}

function signalIcon(label, value, strength, valueLabel) {
    const positive = value > 0;
    const zero = value === 0 || strength === 0;
    const cls = zero ? 'sig-none' : positive ? 'sig-buy' : 'sig-sell';
    const icon = zero ? '◆' : positive ? '▲' : '▼';
    let icons = '';
    for (let i = 1; i <= 3; i++) {
        icons += `<span class="${i <= strength ? cls : 'ghost'}">${icon}</span>`;
    }
    return `<div class="signal">
        <div class="signal-label">${label}</div>
        <div class="signal-icons">${icons}</div>
        <div class="signal-value ${cls}">${valueLabel}</div>
    </div>`;
}

function signalIconsOnly(value, strength) {
    const positive = value > 0;
    const zero = value === 0 || strength === 0;
    const cls = zero ? 'sig-none' : positive ? 'sig-buy' : 'sig-sell';
    const icon = zero ? '◆' : positive ? '▲' : '▼';
    let icons = '';
    for (let i = 1; i <= 3; i++) {
        icons += `<span class="${i <= strength ? cls : 'ghost'}">${icon}</span>`;
    }
    return icons;
}

async function fetchJson(path) {
    const res = await fetch(`${SERVER}${path}`);
    return res.json();
}

async function postJson(path, body) {
    const res = await fetch(`${SERVER}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    return res.json();
}

function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function loadDailySeries(code) {
    if (dailyChartCache[code]) return dailyChartCache[code];

    const res = await fetch(`${DATA_SERVER}/daily/${code}.csv?t=${Date.now()}`);
    if (!res.ok) throw new Error('daily not found');
    const text = await res.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];

    const headers = lines[0].split(',').map(h => h.trim());
    const dateIdx = headers.indexOf('timestamp');
    const priceIdx = headers.indexOf('price');
    const highIdx = headers.indexOf('high');
    const lowIdx = headers.indexOf('low');
    const volIdx = headers.indexOf('vol');
    if (priceIdx < 0) return [];

    const data = lines.slice(1).map(line => {
        const c = line.split(',');
        return {
            date: dateIdx >= 0 ? String(c[dateIdx] || '').replace(/\D/g, '').slice(0, 8) : '',
            price: parseFloat(c[priceIdx]),
            high: highIdx >= 0 ? parseFloat(c[highIdx]) : 0,
            low: lowIdx >= 0 ? parseFloat(c[lowIdx]) : 0,
            vol: volIdx >= 0 ? parseFloat(c[volIdx]) : 0,
        };
    }).filter(d => Number.isFinite(d.price) && d.price > 0).slice(-CHART_POINTS);

    dailyChartCache[code] = data;
    return data;
}

function dailyRangePercent() {
    const input = document.getElementById('signal-pct');
    const v = parseFloat(input?.value || String(DEFAULT_DAILY_RANGE_PERCENT));
    return Number.isFinite(v) && v >= 0 ? v : DEFAULT_DAILY_RANGE_PERCENT;
}

function fallbackSignalPercentThreshold() {
    return DAILY_THRESHOLD_FALLBACK_PCT;
}

function fmtPct(v) {
    if (!Number.isFinite(v)) return '-';
    return (v >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%';
}

function calculateDailyThreshold(data) {
    const cutoff = todayKey();
    const rows = (data || [])
        .filter(d => !d.date || d.date < cutoff)
        .filter(d => Number.isFinite(d.price) && d.price > 0);
    if (rows.length < 6) return null;

    const recent = rows.slice(-6);
    const moves = [];
    for (let i = 1; i < recent.length; i++) {
        const prev = recent[i - 1].price;
        const high = recent[i].high;
        const low = recent[i].low;
        if (prev > 0 && Number.isFinite(high) && Number.isFinite(low) && high >= low) {
            moves.push((high - low) / prev * 100);
        }
    }
    if (!moves.length) return null;
    const avg = moves.reduce((sum, v) => sum + v, 0) / moves.length;
    return avg * dailyRangePercent() / 100;
}

function updateDailyThresholdDisplay(code) {
    const el = document.getElementById('daily-threshold-' + code);
    if (!el) return;
    if (dailyRangePercent() === 0) {
        el.textContent = '등락기준 OFF';
        return;
    }
    const cached = dailyThresholdCache[code];
    if (cached && cached.dateKey === todayKey() && Number.isFinite(cached.value)) {
        el.textContent = `등락기준 ${fmtPct(cached.value)} (${fmtPct(dailyRangePercent())})`;
        return;
    }
    el.textContent = '등락기준 기본 ' + fmtPct(fallbackSignalPercentThreshold());
}

async function ensureDailyThreshold(code) {
    const cached = dailyThresholdCache[code];
    if (cached && cached.dateKey === todayKey()) {
        updateDailyThresholdDisplay(code);
        return cached.value;
    }

    try {
        const data = await loadDailySeries(code);
        const value = calculateDailyThreshold(data);
        dailyThresholdCache[code] = { dateKey: todayKey(), value };
        updateDailyThresholdDisplay(code);
        return value;
    } catch {
        dailyThresholdCache[code] = { dateKey: todayKey(), value: null };
        updateDailyThresholdDisplay(code);
        return null;
    }
}

function recalculateDailyThresholds() {
    dailyThresholdCache = {};
    visibleSymbols().forEach(symbol => requestAnimationFrame(() => ensureDailyThreshold(symbol.code)));
}

function signalPercentThreshold(code) {
    const cached = dailyThresholdCache[code];
    if (cached && cached.dateKey === todayKey() && Number.isFinite(cached.value)) {
        return cached.value;
    }
    return fallbackSignalPercentThreshold();
}

function chartTrendScore(code) {
    const data = dailyChartCache[code];
    if (!data || data.length < 2) return 0;
    const first = data[0].price;
    const last = data[data.length - 1].price;
    const pct = (last - first) / Math.max(1, first);
    const abs = Math.abs(pct);
    const strength = abs >= 0.12 ? 3 : abs >= 0.04 ? 2 : abs > 0 ? 1 : 0;
    return pct > 0 ? strength : pct < 0 ? -strength : 0;
}

function updateFlowScore(code, score) {
    const el = document.getElementById('flow-score-' + code);
    if (!el) return;
    const cls = score > 0 ? 'up' : score < 0 ? 'down' : 'flat';
    el.className = 'flow-score ' + cls;
    el.textContent = '수급 ' + (score > 0 ? '+' : '') + score;
}

function computeFlowScore(code, ntby, totalAsk, totalBid, inv) {
    const trendWeight = 0.5;
    const input = flowInputCache[code];
    const hogaComponent = input?.hogaComponent ??
        signedStrength(ntby, Math.max(totalAsk, totalBid), 'hoga');
    const sum =
        chartTrendScore(code) * trendWeight +
        hogaComponent +
        signedStrength(inv.frgn, 0, 'investor') +
        signedStrength(inv.orgn, 0, 'investor');
    return Math.round((sum / (9 + 3 * trendWeight)) * 100);
}

function updateCachedFlowScore(code) {
    const input = flowInputCache[code];
    if (!input) return;
    updateFlowScore(code, computeFlowScore(code, input.ntby, input.totalAsk, input.totalBid, input.inv));
}

function drawMiniChart(canvas, data) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    if (!data || data.length < 2) return false;

    const prices = data.map(d => d.price);
    const vols = data.map(d => Number.isFinite(d.vol) ? Math.max(0, d.vol) : 0);
    const min = Math.min(...prices);
    const max = Math.max(...prices);
    const span = Math.max(1, max - min);
    const padX = 8 * dpr;
    const padTop = 7 * dpr;
    const padBottom = 6 * dpr;
    const volH = 11 * dpr;
    const gap = 5 * dpr;
    const plotW = w - padX * 2;
    const plotH = h - padTop - padBottom - volH - gap;
    const first = prices[0];
    const last = prices[prices.length - 1];
    const lineColor = last >= first ? '#ff6655' : '#5599ff';
    const fillColor = last >= first ? 'rgba(255,102,85,0.08)' : 'rgba(85,153,255,0.08)';

    const points = prices.map((v, i) => ({
        x: padX + (plotW * i / (data.length - 1)),
        y: padTop + plotH - ((v - min) / span * plotH),
    }));

    ctx.strokeStyle = '#24243a';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(padX, padTop + plotH / 2);
    ctx.lineTo(padX + plotW, padTop + plotH / 2);
    ctx.stroke();

    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.lineTo(padX + plotW, padTop + plotH);
    ctx.lineTo(padX, padTop + plotH);
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();

    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.6 * dpr;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    const lastPoint = points[points.length - 1];
    ctx.beginPath();
    ctx.arc(lastPoint.x, lastPoint.y, 2.3 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = lineColor;
    ctx.fill();

    const maxVol = Math.max(1, ...vols);
    const barGap = 1 * dpr;
    const barW = Math.max(1, plotW / vols.length - barGap);
    const volBase = h - padBottom;
    ctx.fillStyle = 'rgba(130,130,160,0.35)';
    vols.forEach((v, i) => {
        const bh = Math.max(1, (v / maxVol) * volH);
        const x = padX + (plotW * i / vols.length);
        ctx.fillRect(x, volBase - bh, barW, bh);
    });
    return true;
}

function chartTimeLabel(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function drawMarker(ctx, point, color, label, dpr) {
    ctx.beginPath();
    ctx.arc(point.x, point.y, 3.2 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#0f0f1a';
    ctx.lineWidth = 1.2 * dpr;
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = `${9 * dpr}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(label, point.x, Math.max(9 * dpr, point.y - 6 * dpr));
}

function drawReversalChart(canvas, snapshot) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    if (!snapshot || !snapshot.rows || snapshot.rows.length < 2) return false;

    const rows = snapshot.rows;
    const rawPrices = rows.map(row => row.price)
        .concat([snapshot.sellTrigger, snapshot.buyTrigger])
        .filter(Number.isFinite);
    const min = Math.min(...rawPrices);
    const max = Math.max(...rawPrices);
    const span = Math.max(1, max - min);
    const padX = 10 * dpr;
    const padTop = 12 * dpr;
    const padBottom = 14 * dpr;
    const plotW = w - padX * 2;
    const plotH = h - padTop - padBottom;
    const firstTs = rows[0].ts;
    const lastTs = rows[rows.length - 1].ts;
    const tsSpan = Math.max(1, lastTs - firstTs);
    const xOf = ts => padX + ((ts - firstTs) / tsSpan) * plotW;
    const yOf = price => padTop + plotH - ((price - min) / span) * plotH;
    const points = rows.map(row => ({ row, x: xOf(row.ts), y: yOf(row.price) }));
    const first = rows[0].price;
    const last = rows[rows.length - 1].price;
    const lineColor = snapshot.action === 'SELL' ? '#5599ff'
        : snapshot.action === 'BUY' ? '#ff6655'
        : last >= first ? '#ff6655' : '#5599ff';

    ctx.strokeStyle = '#24243a';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(padX, padTop + plotH / 2);
    ctx.lineTo(padX + plotW, padTop + plotH / 2);
    ctx.stroke();

    [
        { price: snapshot.sellTrigger, color: 'rgba(85,153,255,0.55)', label: 'S' },
        { price: snapshot.buyTrigger, color: 'rgba(255,102,85,0.55)', label: 'B' },
    ].forEach(line => {
        if (!Number.isFinite(line.price)) return;
        const y = yOf(line.price);
        ctx.save();
        ctx.setLineDash([3 * dpr, 3 * dpr]);
        ctx.strokeStyle = line.color;
        ctx.lineWidth = 1 * dpr;
        ctx.beginPath();
        ctx.moveTo(padX, y);
        ctx.lineTo(padX + plotW, y);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = line.color;
        ctx.font = `${9 * dpr}px Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(`${line.label} ${fmt(Math.round(line.price))}`, padX + 2 * dpr, y - 2 * dpr);
    });

    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.6 * dpr;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    const highPoint = points.find(p => p.row.ts === snapshot.high.ts && p.row.price === snapshot.high.price);
    const lowPoint = points.find(p => p.row.ts === snapshot.low.ts && p.row.price === snapshot.low.price);
    const lastPoint = points[points.length - 1];
    if (lowPoint) drawMarker(ctx, lowPoint, '#5599ff', 'L', dpr);
    if (highPoint) drawMarker(ctx, highPoint, '#ff6655', 'H', dpr);
    drawMarker(ctx, lastPoint, '#e0e0e0', snapshot.action || 'N', dpr);

    ctx.fillStyle = '#777';
    ctx.font = `${9 * dpr}px Arial`;
    ctx.textAlign = 'right';
    const metric = snapshot.action === 'SELL'
        ? `하락 ${fmtPct(snapshot.pullback)}`
        : snapshot.action === 'BUY'
            ? `반등 ${fmtPct(snapshot.rebound)}`
            : `H↓${fmtPct(snapshot.pullback)} L↑${fmtPct(snapshot.rebound)}`;
    ctx.fillText(`${chartTimeLabel(firstTs)}-${chartTimeLabel(lastTs)} ${metric}`, w - padX, h - 4 * dpr);
    return true;
}

    return entry.action === 'SELL'
        ? entry.price * (1 - ratio)
        : entry.price * (1 + ratio);
}

function priceTick(price) {
    if (price < 2000) return 1;
    if (price < 5000) return 5;
    if (price < 20000) return 10;
    if (price < 50000) return 50;
    if (price < 200000) return 100;
    if (price < 500000) return 500;
    return 1000;
}

function roundRecoveryTargetPrice(entry) {
    const target = recoveryTargetPrice(entry);
    const tick = priceTick(target);
    return entry.action === 'SELL'
        ? Math.floor(target / tick) * tick
        : Math.ceil(target / tick) * tick;
}

    signalOrderStatus[code] = { text, cls };
    const el = document.getElementById('signal-order-' + code);
    if (!el) return;
    el.className = 'signal-order-status ' + cls;
    el.textContent = text || '';
}

function renderSignalOrderStatus(code) {
    const s = signalOrderStatus[code];
    setSignalOrderStatus(code, s?.text || '', s?.cls || '');
}

function signalOrderCandidate(hogaPressure) {
    const holdSeconds = signalHoldSeconds();
    const pressureThreshold = signalPressureThreshold();
    if (pressureThreshold === 0) {
        return { action: '', key: 'pressure:any', label: '압력무시' };
    }
    const persistent = hogaPressure.seconds >= holdSeconds;
    if (persistent && hogaPressure.direction > 0 && hogaPressure.score >= pressureThreshold) {
        return { action: 'BUY', key: 'pressure:BUY', label: '압력' };
    }
    if (persistent && hogaPressure.direction < 0 && hogaPressure.score <= -pressureThreshold) {
        return { action: 'SELL', key: 'pressure:SELL', label: '압력' };
    }
    return null;
}

function todayKey() {
    const d = new Date();
    return d.getFullYear().toString() +
        String(d.getMonth() + 1).padStart(2, '0') +
        String(d.getDate()).padStart(2, '0');
}

function hhmmFromTimeValue(value) {
    const m = /^(\d{2}):(\d{2})$/.exec(value || '');
    return m ? parseInt(m[1], 10) * 100 + parseInt(m[2], 10) : 0;
}

function hhmmFromHogaHour(value) {
    const s = String(value || '').replace(/\D/g, '');
    if (s.length < 4) return 0;
    return parseInt(s.slice(0, 2), 10) * 100 + parseInt(s.slice(2, 4), 10);
}

function timestampFromHogaHour(value) {
    const s = String(value || '').replace(/\D/g, '');
    if (s.length < 4) return Date.now();
    const now = new Date();
    const hour = parseInt(s.slice(0, 2), 10);
    const minute = parseInt(s.slice(2, 4), 10);
    const second = s.length >= 6 ? parseInt(s.slice(4, 6), 10) : 0;
    if (!Number.isFinite(hour) || !Number.isFinite(minute)) return Date.now();
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, second, 0);
    return d.getTime();
}

function recordPriceHistory(code, priceInfo, hogaHour) {
    if (!priceInfo || !Number.isFinite(priceInfo.prpr) || priceInfo.prpr <= 0) return;
    const ts = Math.floor(timestampFromHogaHour(hogaHour) / 60000) * 60000;
    const keepMs = Math.max(240, signalReversalMinutes() * 3) * 60000;
    const arr = priceHistoryCache[code] || [];
    const last = arr[arr.length - 1];
    if (last && last.ts === ts) {
        last.price = priceInfo.prpr;
    } else {
        arr.push({ ts, price: priceInfo.prpr });
    }
    const cutoff = ts - keepMs;
    priceHistoryCache[code] = arr.filter(row => row.ts >= cutoff);
}

function reversalSnapshot(code, priceInfo) {
    const threshold = signalReversalPercent();
    if (threshold <= 0 || !priceInfo || !Number.isFinite(priceInfo.prpr) || priceInfo.prpr <= 0) {
        delete reversalDebugCache[code];
        return null;
    }

    const arr = priceHistoryCache[code] || [];
    if (arr.length < 2) {
        delete reversalDebugCache[code];
        return null;
    }

    const latestTs = arr[arr.length - 1].ts;
    const cutoff = latestTs - signalReversalMinutes() * 60000;
    const rows = arr.filter(row => row.ts >= cutoff);
    if (rows.length < 2) {
        delete reversalDebugCache[code];
        return null;
    }

    let high = rows[0];
    let low = rows[0];
    rows.forEach(row => {
        if (row.price >= high.price) high = row;
        if (row.price <= low.price) low = row;
    });

    const current = priceInfo.prpr;
    const pullback = high.price > 0 ? (high.price - current) / high.price * 100 : 0;
    const rebound = low.price > 0 ? (current - low.price) / low.price * 100 : 0;
    const sellTrigger = high.price * (1 - threshold / 100);
    const buyTrigger = low.price * (1 + threshold / 100);
    let action = '';
    let pivot = null;

    if (high.ts > low.ts && high.ts < latestTs && pullback >= threshold) {
        action = 'SELL';
        pivot = high;
    } else if (low.ts > high.ts && low.ts < latestTs && rebound >= threshold) {
        action = 'BUY';
        pivot = low;
    }

    const snapshot = {
        rows,
        high,
        low,
        current,
        latestTs,
        threshold,
        pullback,
        rebound,
        sellTrigger,
        buyTrigger,
        action,
        pivot,
    };
    reversalDebugCache[code] = snapshot;
    return snapshot;
}

function minuteReversalCandidate(code, priceInfo) {
    const snapshot = reversalSnapshot(code, priceInfo);
    if (!snapshot || !snapshot.action) return null;
    if (snapshot.action === 'SELL') {
        return {
            action: 'SELL',
            key: `reversal:${signalReversalMinutes()}:${snapshot.threshold}:SELL:${snapshot.high.ts}:${snapshot.high.price}`,
            label: '분봉반전',
        };
    }
    if (snapshot.action === 'BUY') {
        return {
            action: 'BUY',
            key: `reversal:${signalReversalMinutes()}:${snapshot.threshold}:BUY:${snapshot.low.ts}:${snapshot.low.price}`,
            label: '분봉반전',
        };
    }
    return null;
}

function mergeCandidateAction(currentAction, candidate) {
    if (!candidate) return null;
    if (!candidate.action) return currentAction || '';
    if (!currentAction) return candidate.action;
    return currentAction === candidate.action ? currentAction : null;
}

function isSignalTimeWindowOpen(hogaHour) {
    const start = hhmmFromTimeValue(signalStartTimeValue());
    const end = hhmmFromTimeValue(signalEndTimeValue());
    if (!start && !end) return true;
    const hhmm = hhmmFromHogaHour(hogaHour);
    if (!hhmm) return false;
    if (start && hhmm < start) return false;
    if (end && hhmm > end) return false;
    return true;
}

function changeCandidate(code, price) {
    if (!price || !Number.isFinite(price.pct)) return null;

    const threshold = signalPercentThreshold(code);
    if (price.pct >= threshold) {
        return { action: 'SELL', key: `change:${threshold}:SELL`, label: '등락률' };
    }
    if (price.pct <= -threshold) {
        return { action: 'BUY', key: `change:${threshold}:BUY`, label: '등락률' };
    }
    return null;
}

function combinedOrderCandidate(code, hogaPressure, price, hogaHour) {
    if (!isSignalTimeWindowOpen(hogaHour)) return null;

    const pressureCandidate = signalOrderCandidate(hogaPressure);
    const hasChangeRule = dailyRangePercent() > 0;
    const hasReversalRule = signalReversalPercent() > 0;
    if (!hasChangeRule && !hasReversalRule) {
        return pressureCandidate && pressureCandidate.action ? pressureCandidate : null;
    }

    let action = '';
    const keyParts = [];
    const labels = [];

    if (hasChangeRule) {
        const pctCandidate = changeCandidate(code, price);
        action = mergeCandidateAction(action, pctCandidate);
        if (action === null) return null;
        keyParts.push(pctCandidate.key);
        labels.push(pctCandidate.label);
    }

    if (hasReversalRule) {
        const reversalCandidate = minuteReversalCandidate(code, price);
        action = mergeCandidateAction(action, reversalCandidate);
        if (action === null) return null;
        keyParts.push(reversalCandidate.key);
        labels.push(reversalCandidate.label);
    }

    action = mergeCandidateAction(action, pressureCandidate);
    if (action === null || !action) return null;
    if (pressureCandidate.action) {
        keyParts.push(pressureCandidate.key);
        labels.push(pressureCandidate.label);
    }

    return {
        action,
        key: keyParts.join('+'),
        label: labels.join('+'),
    };
}

function isReversalOrderCandidate(candidate) {
    return !!candidate && typeof candidate.key === 'string' && candidate.key.includes('reversal:');
}

function hogaClosedClockPauseReason(hogaHour) {
    const hogaHhmm = hhmmFromHogaHour(hogaHour);
    if (hogaHhmm !== 1600 && hogaHhmm !== 2000) return '';

    const d = new Date();
    const nowMinutes = d.getHours() * 60 + d.getMinutes();
    const hogaMinutes = Math.floor(hogaHhmm / 100) * 60 + (hogaHhmm % 100);
    const diff = Math.abs(nowMinutes - hogaMinutes);
    return diff > 5 ? '호가시간 정지 주문보류' : '';
}

function orderPauseReason(hogaHour) {
    const d = new Date();
    if (d.getDay() === 0 || d.getDay() === 6) return '주말 주문보류';
    const hhmm = d.getHours() * 100 + d.getMinutes();
    if (hhmm < 802 || hhmm >= 2000) return '08:02-20:00 주문가능';
    if (hhmm >= 850 && hhmm < 905) return '08:50-09:05 주문보류';
    if (hhmm >= 1519 && hhmm < 1540) return '15:19-15:40 주문보류';
    return hogaClosedClockPauseReason(hogaHour);
}

function orderPrice(o1, action, isFixedMode) {
    if (isFixedMode) {
        return action === 'BUY' ? parseNum(o1.bidp1) : parseNum(o1.askp1);
    }
    return action === 'BUY' ? parseNum(o1.askp1) : parseNum(o1.bidp1);
}

async function getHoldingQty(code) {
    const data = await fetchJson('/holdings');
    if (!data || !Array.isArray(data.stocks)) {
        throw new Error('잔고 응답 확인 실패');
    }
    const normalize = v => String(v || '').replace(/\D/g, '').slice(-6);
    const row = data.stocks.find(s => normalize(s.pdno) === normalize(code));
    return row ? parseNum(row.hldg_qty) : 0;
}

function eligibleRecoveryEntry(code, priceInfo) {
    const pct = signalRecoveryPercent();
    if (pct <= 0 || !priceInfo || !Number.isFinite(priceInfo.prpr) || priceInfo.prpr <= 0) return null;

    const reversal = minuteReversalCandidate(code, priceInfo);
    if (!reversal) return null;

    const entries = recoveryOrderEntries[code] || [];
    return entries.find(entry => {
        const recoveryAction = entry.action === 'SELL' ? 'BUY' : 'SELL';
        if (reversal.action !== recoveryAction) return false;
        const entryPct = entry.recoveryPct;
        if (entry.action === 'SELL') {
            return priceInfo.prpr <= entry.price * (1 - entryPct / 100);
        }
        return priceInfo.prpr >= entry.price * (1 + entryPct / 100);
    }) || null;
}

async function maybeSubmitRecoveryOrder(symbol, o1, priceInfo, hogaHour) {
    if (!signalOrderOn || !signalOrderAuto) return false;
    if (!isSignalTarget(symbol.code)) return false;

    const entry = eligibleRecoveryEntry(symbol.code, priceInfo);
    if (!entry) return false;
    if (recoveryOrderBusy[entry.id]) return true;

    const pauseReason = orderPauseReason(hogaHour);
    if (pauseReason) {
        setSignalOrderStatus(symbol.code, `복구 ${pauseReason}`, 'warn');
        return true;
    }

    const action = entry.action === 'SELL' ? 'BUY' : 'SELL';
    recoveryOrderBusy[entry.id] = true;

    try {
        let qty = entry.qty;
        if (action === 'SELL') {
            const holdingQty = await getHoldingQty(symbol.code);
            if (holdingQty < qty) {
                setSignalOrderStatus(symbol.code, '복구 매도 보유수량 대기', 'warn');
                delete recoveryOrderBusy[entry.id];
                return true;
            }
        }

        const price = orderPrice(o1, action, false);
        if (!price) {
            setSignalOrderStatus(symbol.code, '복구 1호가 없음', 'err');
            delete recoveryOrderBusy[entry.id];
            return true;
        }

        const result = await postJson('/orders/add', {
            code: symbol.code,
            name: symbol.name || symbol.code,
            action,
            qty,
            price: String(price),
            auto: true,
            allow_duplicate: true,
        });

        if (result.result === 'ok') {
            removeRecoveryOrderEntry(symbol.code, entry.id);
            setSignalOrderStatus(symbol.code, `복구 ${action} 자동등록 ${fmt(price)}`, 'ok');
        } else {
            setSignalOrderStatus(symbol.code, `복구 주문실패 ${result.result || '-'}`, 'err');
            delete recoveryOrderBusy[entry.id];
        }
    } catch (e) {
        setSignalOrderStatus(symbol.code, '복구 주문오류 ' + e.message, 'err');
        delete recoveryOrderBusy[entry.id];
    }
    return true;
}

async function maybeSubmitSignalOrder(symbol, o1, hogaPressure, priceInfo, hogaHour) {
    if (!signalOrderOn) {
        setSignalOrderStatus(symbol.code, '', '');
        return;
    }
    if (!isSignalTarget(symbol.code)) {
        setSignalOrderStatus(symbol.code, '', '');
        return;
    }

    if (!isSignalTimeWindowOpen(hogaHour)) {
        setSignalOrderStatus(symbol.code, '시간대기', 'warn');
        return;
    }

    const candidate = combinedOrderCandidate(symbol.code, hogaPressure, priceInfo, hogaHour);
    if (!candidate) {
        delete signalOrderStatus[symbol.code];
        delete signalOrderBusy[symbol.code];
        setSignalOrderStatus(symbol.code, '감시중', '');
        return;
    }
    const action = candidate.action;
    const isReversalCandidate = isReversalOrderCandidate(candidate);
    const reversalLock = signalReversalActionLock[symbol.code];

    if (isReversalCandidate && reversalLock === action) {
        setSignalOrderStatus(symbol.code, `${candidate.label} ${action} 유지중`, action === 'BUY' ? 'buy' : 'sell');
        return;
    }

    if (signalOrderBusy[symbol.code] === candidate.key) {
        renderSignalOrderStatus(symbol.code);
        return;
    }

    const dailyLimit = signalDailyLimit();
    if (dailyLimit > 0 && signalDailyCount(symbol.code) >= dailyLimit) {
        setSignalOrderStatus(symbol.code, `일제한 ${dailyLimit}/${dailyLimit}`, 'warn');
        return;
    }

    const pauseReason = orderPauseReason(hogaHour);
    if (pauseReason) {
        setSignalOrderStatus(symbol.code, pauseReason, 'warn');
        return;
    }

    const holdingMode = signalHoldingMode();
    const isLogMode = holdingMode === '0';
    const isFixedMode = holdingMode === '1';
    const isSplitMode = holdingMode === '2';
    const needsHoldingCheck = isFixedMode || (isSplitMode && action === 'SELL');
    signalOrderBusy[symbol.code] = candidate.key;
    setSignalOrderStatus(symbol.code, `${candidate.label} ${action} ${isLogMode ? '로그확인' : '잔고확인'}`, action === 'BUY' ? 'buy' : 'sell');

    try {
        const holdingQty = needsHoldingCheck ? await getHoldingQty(symbol.code) : 0;
        const requestedQty = signalOrderQty();
        const qty = needsHoldingCheck && action === 'SELL' ? Math.min(requestedQty, holdingQty) : requestedQty;

        if (isFixedMode && action === 'BUY' && holdingQty > 0) {
            setSignalOrderStatus(symbol.code, '보유중 매수보류', 'warn');
            return;
        }
        if (needsHoldingCheck && action === 'SELL' && holdingQty <= 0) {
            setSignalOrderStatus(symbol.code, '미보유 매도보류', 'warn');
            return;
        }
        if (qty <= 0) {
            setSignalOrderStatus(symbol.code, '수량없음', 'warn');
            return;
        }

        const price = orderPrice(o1, action, isFixedMode);
        if (!price) {
            setSignalOrderStatus(symbol.code, '1호가 없음', 'err');
            return;
        }

        const orderAuto = !isLogMode && signalOrderAuto;
        const result = await postJson('/orders/add', {
            code: symbol.code,
            name: symbol.name || symbol.code,
            action,
            qty,
            price: String(price),
            auto: orderAuto,
            allow_duplicate: isSplitMode || isLogMode,
        });

        if (result.result === 'ok') {
            incrementSignalDailyCount(symbol.code);
            if (isReversalCandidate) signalReversalActionLock[symbol.code] = action;
            if (orderAuto) {
                addRecoveryOrderEntry(symbol, action, qty, price);
            }
            const modeLabel = isLogMode ? '로그등록' : orderAuto ? '자동등록' : '대기등록';
            setSignalOrderStatus(
                symbol.code,
                `${candidate.label} ${action} ${modeLabel} ${fmt(price)}`,
                'ok'
            );
        } else if (result.result === 'duplicate') {
            if (isReversalCandidate) signalReversalActionLock[symbol.code] = action;
            setSignalOrderStatus(symbol.code, `주문중 ${result.action || ''} ${result.status || ''}`.trim(), 'warn');
        } else {
            setSignalOrderStatus(symbol.code, `주문실패 ${result.result || '-'}`, 'err');
            delete signalOrderBusy[symbol.code];
        }
    } catch (e) {
        setSignalOrderStatus(symbol.code, '주문오류 ' + e.message, 'err');
        delete signalOrderBusy[symbol.code];
    }
}

async function processSignalOrders(symbol, o1, hogaPressure, priceInfo, hogaHour) {
    const recoveryHandled = await maybeSubmitRecoveryOrder(symbol, o1, priceInfo, hogaHour);
    if (!recoveryHandled) {
        await maybeSubmitSignalOrder(symbol, o1, hogaPressure, priceInfo, hogaHour);
    }
}

    recordPriceHistory(symbol.code, price, hour);
    reversalSnapshot(symbol.code, price);
    if (cardMode === 'detail') requestAnimationFrame(() => renderMiniChart(symbol.code));
    processSignalOrders(symbol, o1, hogaPressure, price, hour);
}

async function renderSymbols() {
    const grid = document.getElementById('grid');
    const list = visibleSymbols();
    grid.classList.toggle('summary', cardMode === 'summary');
    grid.innerHTML = list.length
        ? list.map(renderCardShell).join('')
        : '<div class="loading-msg">매매대상을 선택하세요</div>';
    updateSignalTargetsView();
    list.forEach(bindCardTargetClick);
    list.forEach(symbol => renderRecoveryOrderStatus(symbol.code));
    list.forEach(symbol => requestAnimationFrame(() => ensureDailyThreshold(symbol.code)));
    if (cardMode === 'detail') list.forEach(symbol => {
        bindChartClick(symbol);
        requestAnimationFrame(() => renderMiniChart(symbol.code));
    });
}

async function setCardMode(mode) {
    if (cardMode === mode) return;
    cardMode = mode;
    document.getElementById('btn-detail').classList.toggle('active', mode === 'detail');
    document.getElementById('btn-summary').classList.toggle('active', mode === 'summary');
    await renderSymbols();
    if (autoOn) await refreshAll();
}

async function refreshOne(symbol, seq) {
    try {
        const hoga = await fetchJson(`/hoga?code=${encodeURIComponent(symbol.code)}`);
        let investor = investorCache[symbol.code]?.data || null;
        if (!investor) {
            await delay(API_DELAY_MS);
            investor = await fetchJson(`/investor?code=${encodeURIComponent(symbol.code)}`);
            investorCache[symbol.code] = { ts: Date.now(), data: investor };
        }
        if (seq !== refreshSeq) return;
        renderCard(symbol, hoga, investor);
    } catch {
        if (seq !== refreshSeq) return;
        renderCard(symbol, null, null);
    }
}

async function refreshAll() {
    const list = visibleSymbols();
    if (!list.length) return;
    if (refreshing) return;
    refreshing = true;
    const seq = ++refreshSeq;
    setStatus('갱신중...', true);

    try {
        for (let i = 0; i < list.length; i++) {
            if (seq !== refreshSeq) return;
            await refreshOne(list[i], seq);
            await delay(API_DELAY_MS);
        }
        if (seq === refreshSeq) setStatus(`${nowLabel()} 갱신 완료`, autoOn);
    } finally {
        refreshing = false;
    }
}

async function reloadSymbols() {
    stopAuto();
    const grid = document.getElementById('grid');
    grid.innerHTML = '<div class="loading-msg">시가총액 랭킹 로딩 중...</div>';
    setStatus('랭킹 파일 읽는 중...', false);
    try {
        symbols = await loadSymbols();
        if (!symbols.length) {
            grid.innerHTML = '<div class="loading-msg">시가총액 랭킹 파일에 표시할 종목이 없습니다</div>';
            setStatus('랭킹 없음', false);
            return;
        }
        await renderSymbols();
        setStatus('새로고침 또는 자동갱신 대기', false);
        if (autoOn) startAuto();
    } catch {
        grid.innerHTML = '<div class="loading-msg">시가총액 랭킹 파일을 읽을 수 없습니다</div>';
        setStatus('랭킹 파일 오류', false);
    }
}

function refreshDailyThresholdsIfDateChanged() {
    const key = todayKey();
    if (key === dailyThresholdDateKey) return;
    dailyThresholdDateKey = key;
    dailyChartCache = {};
    dailyThresholdCache = {};
    priceHistoryCache = {};
    reversalDebugCache = {};
    signalDailyCounts = {};
    signalReversalActionLock = {};
    recoveryOrderEntries = {};
    recoveryOrderBusy = {};
    visibleSymbols().forEach(symbol => renderRecoveryOrderStatus(symbol.code));
    visibleSymbols().forEach(symbol => requestAnimationFrame(() => ensureDailyThreshold(symbol.code)));
    if (cardMode === 'detail') {
        visibleSymbols().forEach(symbol => {
            requestAnimationFrame(() => renderMiniChart(symbol.code));
        });
    }
}

function startDailyThresholdClock() {
    if (dailyThresholdTimer) clearInterval(dailyThresholdTimer);
    dailyThresholdTimer = setInterval(refreshDailyThresholdsIfDateChanged, 60000);
}

async function autoRefreshLoop() {
    if (!autoOn) return;
    await refreshAll();
    if (autoOn) autoTimer = setTimeout(autoRefreshLoop, 0);
}

function startAuto() {
    stopAuto();
    document.getElementById('live-dot').classList.add('on');
    autoTimer = setTimeout(autoRefreshLoop, 0);
}

function stopAuto() {
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = null;
}

function toggleAuto() {
    autoOn = !autoOn;
    const btn = document.getElementById('btn-auto');
    btn.classList.toggle('active', autoOn);
    btn.textContent = autoOn ? '자동갱신 ON' : '자동갱신 OFF';
    document.getElementById('live-dot').classList.toggle('on', autoOn);
    if (autoOn) startAuto();
    else stopAuto();
}

function toggleSignalOrder() {
    signalOrderOn = !signalOrderOn;
    const btn = document.getElementById('btn-signal-order');
    btn.classList.toggle('active', signalOrderOn);
    btn.textContent = signalOrderOn ? '주문 ON' : '주문 OFF';
    if (!signalOrderOn) {
        signalOrderBusy = {};
        signalReversalActionLock = {};
        signalOrderStatus = {};
        symbols.forEach(s => setSignalOrderStatus(s.code, '', ''));
    }
    renderSymbols().then(() => { if (autoOn) refreshAll(); });
}

function toggleSignalExec() {
    signalOrderAuto = !signalOrderAuto;
    const btn = document.getElementById('btn-signal-exec');
    btn.classList.toggle('active', signalOrderAuto);
    btn.textContent = signalOrderAuto ? '자동' : '대기';
}

updateSignalTargetsView();
startDailyThresholdClock();
reloadSymbols();
</script>
</body>
</html>
