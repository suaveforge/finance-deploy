<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0f0f1a; color: #e0e0e0; padding: 20px; }
h1 { color: #fff; font-size: 22px; margin-bottom: 14px; }

.toolbar {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 18px;
}
button {
    background: #2a2a3e; color: #ccc;
    border: 1px solid #444; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
}
button:hover { background: #3a3a5e; color: #fff; }
button:disabled { opacity: 0.4; cursor: default; }
button.approve { background: #1a3a2a; border-color: #2a6a4a; color: #55cc88; }

button.cancel:hover  { background: #4a1e1e; }

.status-bar { font-size: 12px; color: #555; margin-bottom: 14px; }

.table-wrap { background: #1a1a2e; border-radius: 10px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
    position: sticky; top: 0;
    background: #12122a; color: #888;
    padding: 10px 12px; text-align: left;
    border-bottom: 1px solid #2a2a4e; white-space: nowrap;
}
thead th.r { text-align: right; }
tbody tr { border-bottom: 1px solid #1e1e30; }
tbody tr:hover { background: #1e1e3a; }
tbody td { padding: 9px 12px; white-space: nowrap; }
tbody td.r { text-align: right; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
.badge-PENDING  { background: #2a2a1a; color: #ccaa44; border: 1px solid #4a4a2a; }
.badge-ORDERED  { background: #1a2a3a; color: #5588ee; border: 1px solid #2a4a6a; }
.badge-FILLED   { background: #1a3a1a; color: #55cc77; border: 1px solid #2a5a2a; }
.badge-FAILED   { background: #3a1a1a; color: #ee5555; border: 1px solid #5a2a2a; }
.badge-CANCELLED{ background: #2a2a2a; color: #888;    border: 1px solid #444; }

.action-BUY  { color: #ee5555; font-weight: bold; }
.action-SELL { color: #5588ee; font-weight: bold; }
.auto-on  { color: #55cc77; }
.auto-off { color: #ccaa44; }
.empty { padding: 40px; text-align: center; color: #444; font-size: 15px; }

/* ── 주문 입력 폼 ── */
.order-form {
    background: #1a1a2e; border: 1px solid #2a2a4e;
    border-radius: 10px; padding: 16px 20px; margin-bottom: 18px;
}
.order-form-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #888; margin-bottom: 14px; cursor: pointer; user-select: none;
}
.order-form-title .arrow { font-size: 10px; transition: transform 0.15s; }
.order-form-title .arrow.open { transform: rotate(90deg); }
.form-body { display: flex; flex-direction: column; gap: 12px; }
.form-row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field label { font-size: 11px; color: #666; }
.form-field input, .form-field select {
    background: #0f0f1a; color: #e0e0e0;
    border: 1px solid #333; border-radius: 5px;
    padding: 7px 10px; font-size: 13px; outline: none;
}
.form-field input:focus, .form-field select:focus { border-color: #556; }
.field-code { position: relative; }
.field-code input { width: 110px; }
.field-name input { width: 140px; color: #aaa; background: #0a0a14 !important; cursor: default; }
.field-qty input  { width: 90px; }
.field-price input { width: 120px; }

/* BUY / SELL 토글 */
.action-toggle { display: flex; }
.action-toggle button {
    border-radius: 0; padding: 7px 18px; font-size: 13px; font-weight: bold;
    border-right-width: 0; transition: background 0.1s;
}
.action-toggle button:first-child { border-radius: 5px 0 0 5px; }
.action-toggle button:last-child  { border-radius: 0 5px 5px 0; border-right-width: 1px; }
.action-toggle .btn-buy           { color: #ee5555; border-color: #553333; }
.action-toggle .btn-buy.active    { background: #3a1515; border-color: #883333; color: #ff6666; }
.action-toggle .btn-sell          { color: #5588ee; border-color: #334455; }
.action-toggle .btn-sell.active   { background: #151e3a; border-color: #335588; color: #6699ff; }

/* 시장가 / 지정가 */
.price-type { display: flex; gap: 0; }
.price-type button {
    border-radius: 0; padding: 7px 12px; font-size: 12px; border-right-width: 0;
}
.price-type button:first-child { border-radius: 5px 0 0 5px; }
.price-type button:last-child  { border-radius: 0 5px 5px 0; border-right-width: 1px; }
.price-type button.active { background: #2a2a4e; border-color: #556; color: #fff; }

/* 자동 실행 토글 */
.auto-toggle { display: flex; }
.auto-toggle button {
    border-radius: 0; padding: 7px 12px; font-size: 12px; border-right-width: 0;
}
.auto-toggle button:first-child { border-radius: 5px 0 0 5px; }
.auto-toggle button:last-child  { border-radius: 0 5px 5px 0; border-right-width: 1px; }
.auto-toggle .btn-auto.active   { background: #1a3a1a; border-color: #2a6a2a; color: #55cc77; }
.auto-toggle .btn-wait.active   { background: #2a2a1a; border-color: #5a5a2a; color: #ccaa44; }

button.submit-order {
    background: #1a2a4a; border-color: #2a4a7a; color: #7eb8f7;
    padding: 8px 20px; font-size: 13px; font-weight: bold;
}
button.submit-order:hover { background: #1e3258; }

/* 종목 검색 드롭다운 */
.search-dropdown {
    position: absolute; top: calc(100% + 2px); left: 0;
    background: #1e1e35; border: 1px solid #3a3a5e;
    border-radius: 6px; z-index: 100; min-width: 220px;
    max-height: 200px; overflow-y: auto; display: none; box-shadow: 0 4px 12px #0008;
}
.search-dropdown .dd-item {
    padding: 8px 12px; cursor: pointer; font-size: 13px;
    display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #2a2a40;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.search-dropdown .dd-item:last-child { border-bottom: none; }
.search-dropdown .dd-item:hover, .search-dropdown .dd-item:active { background: #2a2a4e; }
.search-dropdown .dd-item .icode { color: #555; font-size: 11px; min-width: 60px; }
.search-dropdown .dd-item .iname { color: #ddd; }
.form-msg { font-size: 12px; color: #cc7755; min-height: 16px; }
</style>

<body>

<h1>주문 대기열</h1>

<!-- ── 주문 입력 폼 ── -->
<div class="order-form">
    <div class="order-form-title" onclick="toggleForm()">
        <span class="arrow" id="form-arrow">▶</span>
        <span>수동 주문 입력</span>
    </div>
    <div class="form-body" id="form-body" style="display:none">
        <div class="form-row">
            <!-- 종목 검색 -->
            <div class="form-field field-code">
                <label>종목코드 / 검색</label>
                <input type="text" id="f-code" placeholder="코드 또는 종목명"
                       oninput="onCodeInput()" onkeydown="onCodeKeydown(event)" autocomplete="off">
                <div class="search-dropdown" id="dd"></div>
            </div>
            <!-- 종목명 (자동 채워짐) -->
            <div class="form-field field-name">
                <label>종목명</label>
                <input type="text" id="f-name" readonly placeholder="종목 선택 후 자동 입력">
            </div>
            <!-- 매수/매도 -->
            <div class="form-field">
                <label>구분</label>
                <div class="action-toggle">
                    <button class="btn-buy active" onclick="setAction('BUY')">매수</button>
                    <button class="btn-sell"       onclick="setAction('SELL')">매도</button>
                </div>
            </div>
            <!-- 수량 -->
            <div class="form-field field-qty">
                <label>수량</label>
                <input type="number" id="f-qty" min="1" value="1" placeholder="수량">
            </div>
            <!-- 시장가/지정가 -->
            <div class="form-field">
                <label>가격 유형</label>
                <div class="price-type">
                    <button class="active" id="pt-market" onclick="setPriceType('market')">시장가</button>
                    <button id="pt-limit"  onclick="setPriceType('limit')">지정가</button>
                </div>
            </div>
            <!-- 지정가 입력 -->
            <div class="form-field field-price" id="price-field" style="display:none">
                <label>지정가 (원)</label>
                <input type="number" id="f-price" min="1" placeholder="가격 입력">
            </div>
            <!-- 자동/대기 -->
            <div class="form-field">
                <label>실행</label>
                <div class="auto-toggle">
                    <button class="btn-auto" onclick="setAutoMode(true)">자동</button>
                    <button class="btn-wait active" onclick="setAutoMode(false)">대기</button>
                </div>
            </div>
            <!-- 제출 -->
            <div class="form-field">
                <label>&nbsp;</label>
                <button class="submit-order" onclick="submitOrder()">주문 추가</button>
            </div>
        </div>
        <div class="form-msg" id="form-msg"></div>
    </div>
</div>

<!-- ── 툴바 ── -->
<div class="toolbar">
    <button onclick="load()">새로고침</button>
    <button class="cancel" onclick="clearOrders()">내역 전체 지우기</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#888;cursor:pointer">
        <input type="checkbox" id="auto-refresh" onchange="toggleAutoRefresh()" style="cursor:pointer">
        자동 새로고침 (5초)
    </label>
    <span id="filter-label" style="font-size:12px;color:#555;margin-left:6px"></span>
</div>

<div class="status-bar" id="status-bar">불러오는 중...</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>종목</th>
                <th>구분</th>
                <th class="r">수량</th>
                <th class="r">가격</th>
                <th>실행</th>
                <th>상태</th>
                <th>주문번호</th>
                <th>생성시각</th>
                <th>갱신시각</th>
                <th>액션</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
const TRADE_SERVER = (localStorage.getItem('trade_server') || 'https://api-finance.suaveforge.com:18465/api').replace(/\/$/, '');

let orders = [];
let timer  = null;

// ── 폼 상태 ──
let fAction    = 'BUY';
let fPriceType = 'market'; // 'market' | 'limit'
let fAuto      = false;
let ddItems    = [];
let ddIdx      = -1;
let searchTimer = null;

// ── 폼 토글 ──
function toggleForm() {
    const body  = document.getElementById('form-body');
    const arrow = document.getElementById('form-arrow');
    const open  = body.style.display === 'none';
    body.style.display  = open ? 'flex' : 'none';
    arrow.classList.toggle('open', open);
}

// ── 액션 선택 ──
function setAction(a) {
    fAction = a;
    document.querySelector('.btn-buy').classList.toggle('active', a === 'BUY');
    document.querySelector('.btn-sell').classList.toggle('active', a === 'SELL');
}

// ── 가격 유형 ──
function setPriceType(t) {
    fPriceType = t;
    document.getElementById('pt-market').classList.toggle('active', t === 'market');
    document.getElementById('pt-limit').classList.toggle('active', t === 'limit');
    document.getElementById('price-field').style.display = t === 'limit' ? '' : 'none';
}

// ── 자동/대기 ──
function setAutoMode(auto) {
    fAuto = auto;
    document.querySelector('.btn-auto').classList.toggle('active',  auto);
    document.querySelector('.btn-wait').classList.toggle('active', !auto);
}

// ── 종목 검색 ──
function onCodeInput() {
    clearTimeout(searchTimer);
    const q = document.getElementById('f-code').value.trim();
    if (!q) { hideDd(); return; }
    // 6자리 숫자면 코드 직접 입력으로 간주, 검색 스킵
    if (/^\d{6}$/.test(q)) { hideDd(); return; }
    searchTimer = setTimeout(() => searchCode(q), 200);
}

async function searchCode(q) {
    try {
        const res  = await fetch(`${TRADE_SERVER}/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        ddItems = data;
        ddIdx   = -1;
        showDd(data);
    } catch(e) { hideDd(); }
}

function showDd(items) {
    const dd = document.getElementById('dd');
    if (!items.length) { hideDd(); return; }
    dd.innerHTML = items.map((it, i) =>
        `<div class="dd-item"
              ontouchstart="event.preventDefault();selectItem(${i})"
              onmousedown="selectItem(${i})">
            <span class="icode">${it.code}</span>
            <span class="iname">${it.name}</span>
        </div>`
    ).join('');
    dd.style.display = 'block';
}

function hideDd() {
    document.getElementById('dd').style.display = 'none';
    ddItems = []; ddIdx = -1;
}

function selectItem(i) {
    const it = ddItems[i];
    if (!it) return;
    document.getElementById('f-code').value = it.code;
    document.getElementById('f-name').value = it.name;
    hideDd();
}

function onCodeKeydown(e) {
    const dd = document.getElementById('dd');
    const items = dd.querySelectorAll('.dd-item');
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        ddIdx = Math.min(ddIdx + 1, items.length - 1);
        highlightDd(items);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        ddIdx = Math.max(ddIdx - 1, 0);
        highlightDd(items);
    } else if (e.key === 'Enter' && ddIdx >= 0) {
        e.preventDefault();
        selectItem(ddIdx);
    } else if (e.key === 'Escape') {
        hideDd();
    }
}

function highlightDd(items) {
    items.forEach((el, i) => el.style.background = i === ddIdx ? '#2a2a4e' : '');
}

document.addEventListener('click', e => {
    if (!e.target.closest('.field-code')) hideDd();
});

// ── 주문 제출 ──
async function submitOrder() {
    const code = document.getElementById('f-code').value.trim();
    const name = document.getElementById('f-name').value.trim();
    const qty  = parseInt(document.getElementById('f-qty').value);
    const msg  = document.getElementById('form-msg');

    if (!code) { msg.textContent = '종목코드를 입력하세요.'; return; }
    if (!name) { msg.textContent = '종목명이 없습니다. 검색으로 선택해주세요.'; return; }
    if (!qty || qty < 1) { msg.textContent = '수량을 입력하세요.'; return; }

    let price = '0';
    if (fPriceType === 'limit') {
        price = document.getElementById('f-price').value.trim();
        if (!price || parseInt(price) < 1) { msg.textContent = '지정가를 입력하세요.'; return; }
    }

    msg.textContent = '';
    const body = { code, name, action: fAction, qty, price, auto: fAuto };

    try {
        const res  = await fetch(`${TRADE_SERVER}/orders/add`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.result === 'ok') {
            msg.style.color = '#55cc77';
            msg.textContent = `추가 완료 (id: ${data.id})`;
            setTimeout(() => { msg.textContent = ''; msg.style.color = '#cc7755'; }, 3000);
            await load();
        } else {
            msg.style.color = '#cc7755';
            msg.textContent = '실패: ' + data.result;
        }
    } catch(e) {
        msg.style.color = '#cc7755';
        msg.textContent = '오류: ' + e.message;
    }
}

// ── 목록 로드 ──
function fmtTs(ts) {
    if (!ts || ts.length < 12) return ts || '-';
    return ts.slice(0,4)+'/'+ts.slice(4,6)+'/'+ts.slice(6,8)
          +' '+ts.slice(8,10)+':'+ts.slice(10,12);
}

function fmtPrice(p) {
    if (!p || p === '0') return '시장가';
    return parseInt(p).toLocaleString('ko-KR');
}

async function load() {
    try {
        const res = await fetch(`${TRADE_SERVER}/orders`);
        orders = await res.json();
        render();
        document.getElementById('status-bar').textContent =
            `총 ${orders.length}건 · 마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')}`;
    } catch(e) {
        document.getElementById('status-bar').textContent = '서버 연결 실패: ' + e.message;
    }
}

function render() {
    const tbody = document.getElementById('tbody');
    if (!orders.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">주문이 없습니다</td></tr>';
        return;
    }

    // PENDING 먼저, 나머지는 갱신시각 역순
    const sorted = [...orders].sort((a, b) => {
        const rank = s => s === 'PENDING' ? 0 : s === 'ORDERED' ? 1 : 2;
        if (rank(a.status) !== rank(b.status)) return rank(a.status) - rank(b.status);
        return (b.updated_at || '').localeCompare(a.updated_at || '');
    });

    tbody.innerHTML = sorted.map(o => {
        const canApprove = o.status === 'PENDING' && !o.auto;
        const canCancel  = o.status === 'PENDING' || o.status === 'ORDERED' || o.status === 'FAILED';
        const autoLabel  = o.auto
            ? '<span class="auto-on">자동</span>'
            : '<span class="auto-off">대기</span>';
        const approveBtn = canApprove
            ? `<button class="approve" onclick="approve('${o.id}')">승인</button> `
            : '';
        const cancelBtn  = canCancel
            ? `<button class="cancel"  onclick="cancelOrder('${o.id}')">취소</button>`
            : '';
        return `<tr>
            <td><b style="color:#fff">${o.name}</b> <span style="color:#555;font-size:11px">${o.code}</span></td>
            <td class="action-${o.action}">${o.action === 'BUY' ? '매수' : '매도'}</td>
            <td class="r">${o.qty.toLocaleString('ko-KR')}</td>
            <td class="r">${fmtPrice(o.price)}</td>
            <td>${autoLabel}</td>
            <td><span class="badge badge-${o.status}">${o.status}</span></td>
            <td style="color:#555;font-size:11px">${o.order_no || '-'}</td>
            <td style="color:#555;font-size:11px">${fmtTs(o.created_at)}</td>
            <td style="color:#555;font-size:11px">${fmtTs(o.updated_at)}</td>
            <td>${approveBtn}${cancelBtn}</td>
        </tr>`;
    }).join('');
}

async function approve(id) {
    if (!confirm('이 주문을 승인하시겠습니까?')) return;
    try {
        const res = await fetch(`${TRADE_SERVER}/orders/approve?id=${encodeURIComponent(id)}`, {
            method: 'POST'
        });
        const data = await res.json();
        if (data.result === 'ok') {
            await load();
        } else {
            alert('승인 실패: ' + data.result);
        }
    } catch(e) {
        alert('오류: ' + e.message);
    }
}

async function cancelOrder(id) {
    if (!confirm('이 주문을 취소하시겠습니까?')) return;
    try {
        const res = await fetch(`${TRADE_SERVER}/orders/cancel?id=${encodeURIComponent(id)}`, {
            method: 'POST'
        });
        const data = await res.json();
        if (data.result === 'ok') {
            await load();
        } else {
            alert('취소 실패: ' + data.result);
        }
    } catch(e) {
        alert('오류: ' + e.message);
    }
}

async function clearOrders() {
    if (!orders.length) return;
    const ok = confirm('화면의 주문/로그 내역을 모두 삭제할까요? 실제 증권사 미체결 주문 취소는 아닙니다.');
    if (!ok) return;
    try {
        const res = await fetch(`${TRADE_SERVER}/orders/clear`, { method: 'POST' });
        const data = await res.json();
        if (data.result === 'ok') {
            await load();
            alert(`삭제 완료: ${data.count || 0}건`);
        } else {
            alert('삭제 실패: ' + (data.result || data.error || res.status));
        }
    } catch(e) {
        alert('오류: ' + e.message);
    }
}

function toggleAutoRefresh() {
    const on = document.getElementById('auto-refresh').checked;
    if (on) {
        timer = setInterval(load, 5000);
    } else {
        clearInterval(timer);
        timer = null;
    }
}

load();
</script>
</body>
</html>
