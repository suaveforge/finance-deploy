<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="description" content="통합 증권사 연결, 시세, 잔고, 주문과 리스크 관리를 위한 SuaveForge FINANCE 운영 콘솔.">

<meta name="twitter:description" content="통합 증권사 연결, 시세, 잔고, 주문과 리스크 관리를 위한 SuaveForge FINANCE 운영 콘솔.">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 잔고</title>
<script src="auth.js"></script>
<script src="nav.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0f0f1a; color: #e0e0e0; padding: 20px; }

h1 { color: #fff; font-size: 22px; margin-bottom: 14px; }

.toolbar {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 18px;
}
button {
    background: #2a2a3e; color: #ccc;
    border: 1px solid #444; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    touch-action: manipulation;
}
button:hover { background: #3a3a5e; color: #fff; }
button:active { opacity: 0.75; }
.btn-sm   { padding: 5px 10px; font-size: 12px; }
.btn-buy  { background: #3a1a1a; border-color: #883333; color: #ff9999; }
.btn-buy:hover  { background: #5a2020; color: #ffbbbb; }
.btn-sell { background: #1a1a3a; border-color: #334488; color: #9999ff; }
.btn-sell:hover { background: #20205a; color: #bbbbff; }

/* ── 요약 카드 ── */
.summary {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px; margin-bottom: 20px;
}
.sum-card {
    background: #1a1a2e; border: 1px solid #2a2a3e;
    border-radius: 10px; padding: 14px 16px;
}
.sum-label { font-size: 11px; color: #666; margin-bottom: 6px; }
.sum-value { font-size: 17px; font-weight: bold; color: #f0c040; }

/* ── 테이블 (데스크탑) ── */
.desktop-view { display: block; }
.mobile-view  { display: none; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
    background: #1a1a2e; color: #888;
    padding: 10px; text-align: right;
    border-bottom: 1px solid #333; white-space: nowrap;
}
thead th:nth-child(1) { text-align: left; }
tbody tr { border-bottom: 1px solid #1a1a28; }
tbody tr:hover { background: #1a1a30; }
td { padding: 8px 10px; text-align: right; vertical-align: middle; }
td:nth-child(1) { text-align: left; }
.name { font-weight: bold; color: #fff; }
.code { color: #555; font-size: 11px; margin-top: 2px; }
.name-link { cursor: pointer; }
.name-link:hover .name, .name-link:hover .card-name { color: #7eb8f7; }

/* ── 카드 (모바일) ── */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
}
.card {
    background: #1a1a2e; border: 1px solid #2a2a3e;
    border-radius: 10px; padding: 14px 16px;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.card-name { font-weight: bold; color: #fff; font-size: 16px; }
.card-code { color: #555; font-size: 12px; margin-top: 3px; }
.card-rows { display: flex; flex-direction: column; gap: 6px; font-size: 13px; margin-bottom: 12px; }
.card-row  { display: flex; justify-content: space-between; }
.card-row .lbl { color: #666; }
.card-row .val { color: #ccc; font-weight: bold; }
.card-btns { display: flex; gap: 8px; }
.card-btns button { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; }

/* ── 색상 ── */
.up   { color: #e05555; }
.down { color: #5588e0; }
.flat { color: #777; }

.empty { color: #444; font-size: 15px; padding: 40px 0; text-align: center; }

/* ── 모달 ── */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
    background: #1a1a2e; border: 1px solid #444;
    border-radius: 12px; padding: 24px;
    width: 320px; max-width: calc(100vw - 32px);
}
.modal-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 16px; }
.modal-info  { font-size: 14px; color: #999; line-height: 1.9; margin-bottom: 18px; }
.modal-info b { color: #fff; }
.modal-input {
    width: 100%; background: #0f0f1a;
    border: 1px solid #444; border-radius: 6px;
    color: #fff; padding: 12px; font-size: 18px;
    margin-bottom: 12px; outline: none;
}
.modal-input:focus { border-color: #7eb8f7; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; }

/* ── 토스트 ── */
#toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2a2a3e; border: 1px solid #555;
    color: #fff; padding: 12px 22px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 200;
    white-space: nowrap; max-width: calc(100vw - 32px); text-align: center;
}
#toast.show     { opacity: 1; }
#toast.show.ok  { border-color: #44cc44; color: #88ee88; }
#toast.show.err { border-color: #cc4444; color: #ff9999; }

@media (max-width: 768px) {
    .desktop-view { display: none; }
    .mobile-view  { display: block; }
    body { padding: 12px; }
}
</style>
</head>
<body>

<h1>주식 잔고</h1>

<!-- 요약 -->
<div class="summary">
    <div class="sum-card">
        <div class="sum-label">총평가금액</div>
        <div class="sum-value" id="tot-evlu">-</div>
    </div>
    <div class="sum-card">
        <div class="sum-label">예수금 (D0)</div>
        <div class="sum-value" id="dnca">-</div>
    </div>
    <div class="sum-card">
        <div class="sum-label">D+1 정산</div>
        <div class="sum-value" id="d1">-</div>
    </div>
    <div class="sum-card">
        <div class="sum-label">D+2 정산</div>
        <div class="sum-value" id="d2">-</div>
    </div>
</div>

<!-- 데스크탑 테이블 -->
<div class="desktop-view">
    <table>
        <thead>
            <tr>
                <th style="text-align:left">종목</th>
                <th>보유수량</th>
                <th>매입평균가</th>
                <th>현재가</th>
                <th>매입금액</th>
                <th>평가금액</th>
                <th>손익금액</th>
                <th>손익율</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tbl-body">
            <tr><td colspan="9" class="empty">데이터를 불러오는 중...</td></tr>
        </tbody>
    </table>
</div>

<!-- 모바일 카드 -->
<div class="mobile-view">
    <div class="card-grid" id="card-grid">
        <div class="empty">데이터를 불러오는 중...</div>
    </div>
</div>

<!-- 주문 모달 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="m-title"></div>
        <div class="modal-info"  id="m-info"></div>
        <input class="modal-input" id="m-qty" type="number" min="1" placeholder="수량 입력" inputmode="numeric">
        <input class="modal-input" id="m-price" type="number" min="0" placeholder="지정가 (비우면 시장가)" inputmode="numeric">
        <div class="modal-btns">
            <button id="m-confirm">확인</button>
            <button onclick="closeModal()">취소</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const SERVER = localStorage.getItem('trade_server') || 'https://api-finance.suaveforge.com:18465/api';

const fmtNum   = n => Number(n).toLocaleString('ko-KR');
const pfls_cls = v => Number(v) > 0 ? 'up' : Number(v) < 0 ? 'down' : 'flat';
const pfls_pfx = v => Number(v) > 0 ? '+' : '';

function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 3000);
}

// ── 모달 ─────────────────────────────────────────────
let modalAction = null;

async function openModal(action, code, name, hldg_qty = '') {
    modalAction = { action, code, name };
    document.getElementById('m-title').textContent = action === 'buy' ? '매수 주문' : '매도 주문';
    document.getElementById('m-info').innerHTML = `종목: <b>${name} (${code})</b>`;
    const btn = document.getElementById('m-confirm');
    btn.className = action === 'buy' ? 'btn-buy' : 'btn-sell';
    btn.textContent = action === 'buy' ? '매수 실행' : '매도 실행';
    document.getElementById('m-qty').value   = '';
    document.getElementById('m-price').value = '';
    document.getElementById('modal').classList.add('show');
    setTimeout(() => document.getElementById('m-qty').focus(), 50);
    try {
        if (action === 'sell') {
            const r = await fetch(SERVER + '/price?code=' + code);
            const j = await r.json();
            if (j.price)  document.getElementById('m-price').value = j.price;
            if (hldg_qty) document.getElementById('m-qty').value   = hldg_qty;
        } else {
            const [rp, rq] = await Promise.all([
                fetch(SERVER + '/price?code='     + code),
                fetch(SERVER + '/avail_buy?code=' + code),
            ]);
            const jp = await rp.json();
            const jq = await rq.json();
            if (jp.price)                   document.getElementById('m-price').value = jp.price;
            if (jq.avail_qty !== undefined)  document.getElementById('m-qty').value   = jq.avail_qty;
        }
    } catch {}
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    modalAction = null;
}

document.getElementById('m-confirm').onclick = async () => {
    if (!modalAction) return;
    const qty   = document.getElementById('m-qty').value.trim();
    const price = document.getElementById('m-price').value.trim();
    if (!qty || Number(qty) <= 0) { toast('수량을 입력하세요', 'err'); return; }

    const { action, code, name } = modalAction;
    const isLimit = price && Number(price) > 0;
    const body = isLimit ? { code, qty, price } : { code, qty };
    closeModal();

    try {
        const r = await fetch(SERVER + '/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const j = await r.json();
        if (j.error) {
            toast(j.error, 'err');
        } else if (j.ok) {
            const label = (action === 'buy' ? '매수' : '매도') + (isLimit ? '(지정가)' : '(시장가)');
            toast(`${name} ${fmtNum(qty)}주 ${label} 완료 (${fmtNum(j.price)}원)`, 'ok');
            loadHoldings();
        } else {
            toast(`주문 실패 (rt_cd: ${j.rt_cd})`, 'err');
        }
    } catch { toast('서버 연결 오류', 'err'); }
};

document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── 잔고 로드 ─────────────────────────────────────────
async function loadHoldings() {
    try {
        const r = await fetch(SERVER + '/holdings');
        const j = await r.json();
        if (j.error) { alert(j.error); return; }

        const s = j.summary;
        document.getElementById('tot-evlu').textContent = fmtNum(s.tot_evlu_amt) + '원';
        document.getElementById('dnca').textContent     = fmtNum(s.dnca_tot_amt) + '원';
        document.getElementById('d1').textContent       = fmtNum(s.nxdy_excc_amt) + '원';
        document.getElementById('d2').textContent       = fmtNum(s.prvs_rcdl_excc_amt) + '원';

        const stocks = j.stocks;

        // 테이블
        const tbody = document.getElementById('tbl-body');
        if (!stocks.length) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">보유 종목 없음</td></tr>';
        } else {
            tbody.innerHTML = stocks.map(s => {
                const cls = pfls_cls(s.evlu_pfls_amt);
                const pfx = pfls_pfx(s.evlu_pfls_amt);
                return `<tr>
                    <td class="name-link" onclick="location.href='search.html?code=${s.pdno}'"><div class="name">${s.prdt_name}</div><div class="code">${s.pdno}</div></td>
                    <td>${fmtNum(s.hldg_qty)}주</td>
                    <td>${fmtNum(s.pchs_avg_pric)}</td>
                    <td><a href="hoga.html?code=${s.pdno}" style="text-decoration:none;color:inherit">${fmtNum(s.prpr)}</a></td>
                    <td>${fmtNum(s.pchs_amt)}</td>
                    <td>${fmtNum(s.evlu_amt)}</td>
                    <td class="${cls}">${pfx}${fmtNum(s.evlu_pfls_amt)}</td>
                    <td class="${cls}">${pfx}${Number(s.evlu_pfls_rt).toFixed(2)}%</td>
                    <td style="white-space:nowrap">
                        <button class="btn-sm btn-buy"  onclick="openModal('buy','${s.pdno}','${s.prdt_name}')">매수</button>
                        <button class="btn-sm btn-sell" onclick="openModal('sell','${s.pdno}','${s.prdt_name}','${s.hldg_qty}')">매도</button>
                    </td>
                </tr>`;
            }).join('');
        }

        // 카드
        const grid = document.getElementById('card-grid');
        if (!stocks.length) {
            grid.innerHTML = '<div class="empty">보유 종목 없음</div>';
        } else {
            grid.innerHTML = stocks.map(s => {
                const cls = pfls_cls(s.evlu_pfls_amt);
                const pfx = pfls_pfx(s.evlu_pfls_amt);
                return `<div class="card">
                    <div class="card-top">
                        <div class="name-link" onclick="location.href='search.html?code=${s.pdno}'">
                            <div class="card-name">${s.prdt_name}</div>
                            <div class="card-code">${s.pdno}</div>
                        </div>
                        <span class="${cls}" style="font-size:15px;font-weight:bold">${pfx}${Number(s.evlu_pfls_rt).toFixed(2)}%</span>
                    </div>
                    <div class="card-rows">
                        <div class="card-row"><span class="lbl">보유수량</span><span class="val">${fmtNum(s.hldg_qty)}주</span></div>
                        <div class="card-row"><span class="lbl">매입평균가</span><span class="val">${fmtNum(s.pchs_avg_pric)}원</span></div>
                        <div class="card-row"><span class="lbl">현재가</span><span class="val"><a href="hoga.html?code=${s.pdno}" style="text-decoration:none;color:inherit">${fmtNum(s.prpr)}원</a></span></div>
                        <div class="card-row"><span class="lbl">평가금액</span><span class="val">${fmtNum(s.evlu_amt)}원</span></div>
                        <div class="card-row"><span class="lbl">손익금액</span><span class="val ${cls}">${pfx}${fmtNum(s.evlu_pfls_amt)}원</span></div>
                    </div>
                    <div class="card-btns">
                        <button class="btn-buy"  onclick="openModal('buy','${s.pdno}','${s.prdt_name}')">매수</button>
                        <button class="btn-sell" onclick="openModal('sell','${s.pdno}','${s.prdt_name}','${s.hldg_qty}')">매도</button>
                    </div>
                </div>`;
            }).join('');
        }
    } catch { alert('서버 연결 오류'); }
}

loadHoldings();
</script>
</body>
</html>
